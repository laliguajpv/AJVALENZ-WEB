<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJVALENZ | Contacto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        customBlue: '#334155', 
                        accentEsmeralda: '#10b981',
                    }
                }
            }
        }
    </script>
    <style type="text/css">
        body { background-color: #334155; color: #f1f5f9; position: relative; min-height: 100vh; overflow-x: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease; height: 100%; display: flex; flex-direction: column; }
        html { scroll-behavior: smooth; }
        .input-form { background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 0.75rem; padding: 1rem; width: 100%; outline: none; transition: border-color 0.3s ease; }
        .input-form:focus { border-color: #10b981; }
    </style>
</head>
<body class="font-sans antialiased">

    <nav class="p-6 fixed top-0 w-full z-50 glass-card border-b border-white/10 h-auto">
        <div class="max-w-7xl mx-auto flex justify-between items-center w-full">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-3">
                    <img src="logo.png" alt="Logo" class="h-10 w-auto"> 
                    <h1 class="text-xl font-bold text-white uppercase tracking-tight">AJ<span class="text-accentEsmeralda">VALENZ</span></h1>
                </a>
            </div>
            <div class="space-x-6 hidden md:block text-xs uppercase tracking-widest font-bold text-slate-200">
                <a href="index.html" class="hover:text-accentEsmeralda transition">Inicio</a>
                <a href="software.html" class="hover:text-accentEsmeralda transition">Software</a>
                <a href="libros.html" class="hover:text-accentEsmeralda transition">Escritor</a>
                <a href="fotografia.html" class="hover:text-accentEsmeralda transition">Fotografía</a>
                <a href="contacto.html" class="text-accentEsmeralda transition">Contacto</a>
            </div>
        </div>
    </nav>

    <main class="pt-48 pb-24 px-6 relative z-10">
        <div class="max-w-4xl mx-auto glass-card p-10 md:p-16 rounded-3xl shadow-2xl relative overflow-hidden">
            <div class="mb-10 text-center">
                <h2 class="text-4xl font-bold text-white mb-4 uppercase tracking-tighter">¿Iniciamos un <span class="text-accentEsmeralda">Proyecto</span>?</h2>
                <p class="text-slate-300">Déjame un mensaje para contrataciones, soporte técnico o adquirir ejemplares de mis libros.</p>
            </div>
            <form id="form-contacto" action="https://formspree.io/f/xjgjdgdn" method="POST" class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-accentEsmeralda mb-2 uppercase">Nombre</label>
                        <input type="text" name="name" required placeholder="Tu nombre" class="input-form">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-accentEsmeralda mb-2 uppercase">Email</label>
                        <input type="email" name="email" required placeholder="tu@correo.com" class="input-form">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-accentEsmeralda mb-2 uppercase">Mensaje</label>
                    <textarea name="message" rows="6" required placeholder="¿En qué te puedo ayudar?" class="input-form resize-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-accentEsmeralda text-slate-900 font-bold text-lg py-4 rounded-xl hover:bg-emerald-400 transition shadow-lg uppercase tracking-widest">
                    Enviar Mensaje
                </button>
            </form>
        </div>
    </main>

    <footer class="py-12 text-center text-slate-500 text-sm relative z-10">
        <p>&copy; 2026 AJVALENZ.cl</p>
    </footer>

    <!-- BOTÓN WHATSAPP -->
