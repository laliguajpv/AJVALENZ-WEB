<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotografía | AJVALENZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { customBlue: '#334155', accentEsmeralda: '#10b981' } } }
        }
    </script>
    <style>
        body { background-color: #334155; color: #f1f5f9; min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); }
        .photo-container { overflow: hidden; border-radius: 1rem; aspect-ratio: 4/3; background: #1e293b; position: relative; }
        .photo-img { width: 100%; height: 100%; object-fit: cover; }
        .input-form { background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 0.75rem; padding: 1rem; width: 100%; outline: none; }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="font-sans antialiased">

    <nav class="p-6 fixed top-0 w-full z-50 glass-card border-b border-white/10 h-auto">
        <div class="max-w-7xl mx-auto flex justify-between items-center w-full">
            <a href="index.html" class="flex items-center gap-3">
                <img src="logo.png" alt="Logo" class="h-10 w-auto"> 
                <h1 class="text-xl font-bold text-white uppercase tracking-tight">AJ<span class="text-accentEsmeralda">VALENZ</span></h1>
            </a>
            <div class="space-x-6 hidden md:block text-xs uppercase tracking-widest font-bold text-slate-200">
                <a href="index.html" class="hover:text-accentEsmeralda transition">Inicio</a>
                <a href="fotografia.html" class="text-accentEsmeralda transition">Fotografía</a>
                <a href="#contacto" class="bg-accentEsmeralda text-slate-900 px-5 py-2 rounded-full font-bold">Contacto</a>
            </div>
        </div>
    </nav>

    <header class="pt-44 pb-12 px-6 text-center max-w-5xl mx-auto">
        <h2 class="text-4xl md:text-6xl font-extrabold mb-8 text-white tracking-tight">Galería <span class="text-accentEsmeralda">Fotográfica</span></h2>
        <div class="glass-card p-8 rounded-3xl mb-8 border-l-4 border-l-accentEsmeralda text-left">
            <p class="text-xl text-slate-200 leading-relaxed italic">
                "Esta no es una galería retocada. Cada imagen aquí es un fragmento de tiempo capturado de forma amateur y espontánea."
            </p>
        </div>
        <div class="inline-block bg-slate-800 border border-white/10 px-8 py-4 rounded-2xl mb-12">
            <p class="text-3xl font-bold text-white">$2.500 CLP</p>
        </div>
    </header>

    <div class="flex flex-wrap justify-center gap-4 mb-12 px-6">
        <button onclick="mostrar('paisajes')" class="px-6 py-2 rounded-full bg-slate-700 text-white hover:bg-accentEsmeralda hover:text-slate-900 transition font-bold uppercase text-xs tracking-widest">Paisajes (141)</button>
        <button onclick="mostrar('luna')" class="px-6 py-2 rounded-full bg-slate-700 text-white hover:bg-accentEsmeralda hover:text-slate-900 transition font-bold uppercase text-xs tracking-widest">Luna (9)</button>
        <button onclick="mostrar('flores')" class="px-6 py-2 rounded-full bg-slate-700 text-white hover:bg-accentEsmeralda hover:text-slate-900 transition font-bold uppercase text-xs tracking-widest">Flores (97)</button>
        <button onclick="mostrar('varias')" class="px-6 py-2 rounded-full bg-slate-700 text-white hover:bg-accentEsmeralda hover:text-slate-900 transition font-bold uppercase text-xs tracking-widest">Varias (13)</button>
        <button onclick="mostrar('atardeceres')" class="px-6 py-2 rounded-full bg-slate-700 text-white hover:bg-accentEsmeralda hover:text-slate-900 transition font-bold uppercase text-xs tracking-widest">Atardeceres (140)</button>
    </div>

    <section class="py-12 px-6 max-w-7xl mx-auto">
        <div id="galeria-dinamica" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </section>

    <section id="contacto" class="py-24 px-6 bg-slate-900/40 border-t border-white/5">
        <div class="max-w-4xl mx-auto">
            <div class="glass-card p-10 rounded-3xl">
                <h2 class="text-3xl font-bold text-white mb-6 text-center">Adquirir Obra</h2>
                <form action="https://formspree.io/f/mbdplakn" method="POST" class="space-y-6">
                    <div class="grid md:grid-cols-2 gap-6">
                        <input type="text" name="name" required placeholder="Tu nombre" class="input-form">
                        <input type="email" name="email" required placeholder="tu@correo.com" class="input-form">
                    </div>
                    <textarea id="campo-mensaje" name="message" rows="4" required class="input-form" placeholder="¿Qué fotografía te interesa?"></textarea>
                    <button type="submit" class="w-full bg-accentEsmeralda text-slate-900 font-bold text-lg py-4 rounded-xl hover:bg-emerald-400 transition">Enviar Solicitud</button>
                </form>
            </div>
        </div>
    </section>

    <script>
        const contenedor = document.getElementById('galeria-dinamica');
        
        const configuracion = {
            'paisajes': { total: 141, carpeta: 'img/PAISAJES', prefijo: 'paisajes' },
            'luna': { total: 9, carpeta: 'img/LUNA', prefijo: 'luna' },
            'flores': { total: 97, carpeta: 'img/FLORES', prefijo: 'flores' },
            'varias': { total: 13, carpeta: 'img/VARIAS', prefijo: 'varias' },
            'atardeceres': { total: 140, carpeta: 'img/ATARDECERES', prefijo: 'atardeceres' }
        };

        function mostrar(catId) {
            const cat = configuracion[catId];
            if (!cat) return;
            
            contenedor.innerHTML = "";
            for (let i = 1; i <= cat.total; i++) {
                contenedor.innerHTML += `
                    <div class="glass-card p-4 rounded-2xl flex flex-col">
                        <div class="photo-container mb-4">
                            <div class="absolute inset-0 z-10 cursor-pointer" onclick="seleccionar('${catId} # ${i}')"></div>
                            <img src="${cat.carpeta}/${cat.prefijo}${i}.jpg" class="photo-img" loading="lazy" onerror="this.src='logo.png'">
                        </div>
                        <div class="text-center">
                            <h4 class="text-white font-bold uppercase text-xs">Obra ${i}</h4>
                        </div>
                    </div>
                `;
            }
        }

        function seleccionar(texto) {
            document.getElementById('campo-mensaje').value = "Me interesa la obra: " + texto;
            window.location.href = '#contacto';
        }

        // Carga inicial obligatoria
        window.onload = () => mostrar('paisajes');
    </script>
</body>
</html>
